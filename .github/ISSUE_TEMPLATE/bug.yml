name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste an API key, token or account number. If this is a safety problem (an order without your yes, a leaked key), use the private Security tab instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of python scripts/doctor.py
      render: text
